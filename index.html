<!DOCTYPE html><!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d0b">

<title>Fᴏʀ Dᴀᴅᴀ🥳</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>
:root {
    --gold: #c9a45c;
    --gold-light: #f3d99b;
    --dark: #080d0b;
    --text: #f5eee0;
    --muted: #a69c88;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(ellipse at top, #1b3024 0%, transparent 55%),
        var(--dark);
    color: var(--text);
    font-family: 'Montserrat', sans-serif;
    overflow-x: hidden;
    animation: pageAppear .7s ease both;
}

@keyframes pageAppear {
    from { opacity: 0; }
    to { opacity: 1; }
}

button {
    font-family: inherit;
    cursor: pointer;
}

/* OPENING SCREEN */

#openingScreen {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 25px;
    background: radial-gradient(circle at center, #1b3024, #080d0b 75%);
    opacity: 0;
    visibility: visible;
    pointer-events: none;
    transition: opacity .55s ease, visibility .55s ease;
}

#openingScreen.ready {
    opacity: 1;
    pointer-events: auto;
}

#openingScreen.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.opening-content {
    width: 100%;
    max-width: 500px;
    transform: translateY(8px);
    opacity: 0;
    transition: opacity .65s ease, transform .65s ease;
}

#openingScreen.ready .opening-content {
    opacity: 1;
    transform: translateY(0);
}

.opening-small {
    color: var(--gold);
    font-size: 10px;
    letter-spacing: 5px;
    margin-bottom: 25px;
}

.opening-title {
    font-family: 'Cinzel', serif;
    font-size: clamp(28px, 7vw, 48px);
    line-height: 1.4;
    color: var(--gold-light);
    margin-bottom: 15px;
}

.opening-subtitle {
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--muted);
    margin-bottom: 45px;
}

.reveal-button {
    padding: 16px 35px;
    border: 1px solid var(--gold);
    border-radius: 2px;
    background: transparent;
    color: var(--gold-light);
    letter-spacing: 3px;
    font-size: 11px;
    transition: .3s;
}

.reveal-button:hover {
    background: var(--gold);
    color: var(--dark);
    box-shadow: 0 0 30px #c9a45c55;
}

/* MAIN CONTENT */

#mainContent {
    opacity: 0;
    visibility: hidden;
    transform: translateY(10px);
    transition:
        opacity .75s ease,
        transform .75s ease,
        visibility .75s ease;
    padding: 55px 18px 60px;
}

#mainContent.show {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

.container {
    width: 100%;
    max-width: 850px;
    margin: auto;
    text-align: center;
}

.section-label {
    color: var(--gold);
    font-size: 10px;
    letter-spacing: 5px;
    margin-bottom: 16px;
}

.main-title {
    font-family: 'Cinzel', serif;
    color: var(--gold-light);
    font-size: clamp(27px, 6vw, 45px);
    font-weight: 500;
    margin-bottom: 35px;
}

/* SLIDESHOW */

.slideshow {
    width: 100%;
    max-width: 650px;
    margin: 0 auto;
}

.photo-frame {
    position: relative;
    width: 100%;
    height: min(72vh, 600px);
    min-height: 260px;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0d1510;
    border: 1px solid #c9a45c55;
    border-radius: 5px;
    overflow: hidden;
    padding: 8px;
}

/* TWO-LAYER PHOTO CROSSFADE */

.photo-frame img {
    position: absolute;
    inset: 8px;
    width: calc(100% - 16px);
    height: calc(100% - 16px);
    object-fit: contain;
    opacity: 0;
    transition: opacity .55s ease-in-out;
    pointer-events: none;
}

.photo-frame img.active {
    opacity: 1;
    z-index: 2;
}

.photo-frame img.inactive {
    opacity: 0;
    z-index: 1;
}

.slide-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 30px;
    margin-top: 18px;
}

.slide-controls button {
    width: 42px;
    height: 38px;
    border: 1px solid #c9a45c77;
    background: transparent;
    color: var(--gold-light);
    font-size: 22px;
    border-radius: 3px;
    transition: .25s;
}

.slide-controls button:hover {
    background: var(--gold);
    color: var(--dark);
}

.slide-number {
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 3px;
}

/* NAME AND DATE */

.name-section {
    margin: 0 0 35px;
}

.name-section h2 {
    font-family: 'Cinzel', serif;
    font-size: clamp(27px, 7vw, 48px);
    font-weight: 500;
    color: var(--gold-light);
    letter-spacing: 2px;
}

.birth-date {
    margin-top: 15px;
    font-size: 12px;
    letter-spacing: 5px;
    color: var(--gold);
}

.birth-time {
    margin-top: 10px;
    font-size: 11px;
    letter-spacing: 4px;
    color: var(--gold-light);
    opacity: 0.85;
}

/* SINCE BIRTH COUNTER */

.counter-section {
    margin: 35px auto 65px;
}

.counter-title {
    font-family: 'Cinzel', serif;
    font-size: 22px;
    color: var(--gold-light);
    margin-bottom: 25px;
    font-weight: 400;
}

.counter-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
    max-width: 750px;
    margin: auto;
}

.counter-box {
    padding: 20px 5px;
    border: 1px solid #c9a45c55;
    background: #101914;
    border-radius: 4px;
}

.counter-box span {
    display: block;
    color: var(--gold-light);
    font-family: 'Cinzel', serif;
    font-size: clamp(17px, 4vw, 30px);
    font-variant-numeric: tabular-nums;
}

.counter-box small {
    display: block;
    color: var(--muted);
    font-size: 9px;
    letter-spacing: 2px;
    margin-top: 8px;
}

/* PREMIUM CLOCK */

.clock-section {
    margin: 55px auto;
}

.clock-heading {
    font-family: 'Cinzel', serif;
    font-size: 20px;
    color: var(--gold-light);
    font-weight: 400;
    margin-bottom: 30px;
}

.clock {
    position: relative;
    width: min(78vw, 330px);
    aspect-ratio: 1;
    margin: auto;
    border-radius: 50%;
    border: 2px solid var(--gold);
    background:
        radial-gradient(circle at center, #1d3023 0%, #101a13 68%, #080d0b 100%);
    box-shadow:
        0 0 0 5px #c9a45c12,
        0 0 0 7px #c9a45c22,
        0 0 35px #c9a45c25,
        inset 0 0 25px #00000088;
}

.clock-markers,
.clock-numbers {
    position: absolute;
    inset: 0;
}

.tick {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 1px;
    height: 7px;
    background: #a9956b;
    transform-origin: center;
}

.tick.major {
    width: 2px;
    height: 13px;
    background: var(--gold-light);
}

.clock-number {
    position: absolute;
    transform: translate(-50%, -50%);
    color: var(--gold-light);
    font-family: 'Cinzel', serif;
    font-size: clamp(12px, 3vw, 17px);
}

.clock-brand {
    position: absolute;
    top: 30%;
    left: 50%;
    transform: translateX(-50%);
    color: var(--gold);
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 3px;
    white-space: nowrap;
}

.clock-est {
    position: absolute;
    bottom: 27%;
    left: 50%;
    transform: translateX(-50%);
    color: var(--gold);
    font-size: 8px;
    letter-spacing: 3px;
    white-space: nowrap;
}

.hand {
    position: absolute;
    left: 50%;
    bottom: 50%;
    transform: translateX(-50%);
    transform-origin: 50% 100%;
    border-radius: 50% 50% 2px 2px;
    z-index: 3;
}

.hour-hand {
    width: 6px;
    height: 25%;
    background: linear-gradient(to right, #98733c, #fff0bd, #c9a45c);
    box-shadow: 0 0 5px #c9a45c55;
}

.minute-hand {
    width: 3.5px;
    height: 34%;
    background: linear-gradient(to right, #9f875a, #fff2c8, #c9a45c);
    box-shadow: 0 0 5px #c9a45c55;
}

.second-hand {
    width: 1.5px;
    height: 39%;
    background: #e47c5d;
    border-radius: 2px;
    box-shadow: 0 0 5px #e47c5d88;
}

.clock-center {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: radial-gradient(circle, #fff2c8, #c9a45c);
    border: 2px solid #98733c;
    transform: translate(-50%, -50%);
    z-index: 5;
    box-shadow: 0 0 8px #c9a45c66;
}

/* DIGITAL CLOCK */

.digital-clock {
    margin-top: 22px;
    text-align: center;
    font-family: 'Cinzel', serif;
    font-size: clamp(25px, 7vw, 36px);
    font-weight: 500;
    letter-spacing: 4px;
    color: var(--gold-light);
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 18px #c9a45c33;
}

/* CALENDAR */

.calendar-section {
    margin: 65px auto;
    max-width: 600px;
}

.calendar-title {
    font-family: 'Cinzel', serif;
    color: var(--gold-light);
    font-size: 22px;
    font-weight: 400;
    margin-bottom: 25px;
}

.calendar {
    padding: 20px;
    background: #101914;
    border: 1px solid #c9a45c55;
    border-radius: 5px;
}

.calendar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 20px;
}

.calendar-header h3 {
    flex: 1;
    color: var(--gold-light);
    font-family: 'Cinzel', serif;
    font-size: clamp(13px, 3vw, 18px);
    font-weight: 400;
}

.calendar-header button {
    flex-shrink: 0;
    border: 1px solid #c9a45c66;
    color: var(--gold-light);
    background: transparent;
    border-radius: 3px;
    min-width: 34px;
    height: 32px;
    font-size: 18px;
}

.calendar-header .today-button {
    padding: 0 10px;
    font-size: 10px;
    letter-spacing: 1px;
}

.calendar-header button:hover {
    background: var(--gold);
    color: var(--dark);
}

.calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
}

.calendar-day {
    min-height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #d2c7b3;
    font-size: 12px;
    border-radius: 3px;
}

.calendar-day.weekday {
    color: var(--gold);
    font-size: 10px;
    letter-spacing: 1px;
}

.calendar-day.birthday {
    background: var(--gold);
    color: #080d0b;
    font-weight: 700;
    border-radius: 50%;
}

.calendar-day.today {
    outline: 1px solid var(--gold-light);
    outline-offset: -2px;
}

/* MUSIC BUTTON */

.music-section {
    margin: 55px auto 20px;
}

.music-button {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 1px solid var(--gold);
    color: var(--gold-light);
    background: transparent;
    font-size: 20px;
    transition: .3s;
}

.music-button:hover {
    background: var(--gold);
    color: var(--dark);
}

/* MOBILE */

@media (max-width: 480px) {
    #mainContent {
        padding: 40px 14px;
    }

    .counter-grid {
        gap: 5px;
    }

    .counter-box {
        padding: 13px 2px;
    }

    .counter-box span {
        font-size: clamp(14px, 4vw, 20px);
    }

    .counter-box small {
        font-size: 7px;
        letter-spacing: .5px;
    }

    .calendar {
        padding: 13px 9px;
    }

    .calendar-grid {
        gap: 3px;
    }

    .calendar-day {
        min-height: 34px;
    }

    .calendar-header {
        gap: 5px;
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}
</style>
</head>

<body>

<!-- OPENING SCREEN -->

<section id="openingScreen">
    <div class="opening-content">
        <p class="opening-small">A DAY WORTH REMEMBERING</p>
        <h1 class="opening-title">A Little Surprise</h1>
        <p class="opening-subtitle">Oɴʟʏ Fᴏʀ Dᴀᴅᴀ🥳</p>
        <button class="reveal-button" id="revealButton">
            REVEAL SURPRISE
        </button>
    </div>
</section>

<!-- MAIN CONTENT -->

<main id="mainContent">
<div class="container">

    <p class="section-label">A SPECIAL DAY</p>
    <h1 class="main-title">Happy Birthday Dada 🥳</h1>

    <!-- PHOTO SLIDESHOW -->

    <section class="slideshow">
        <div class="photo-frame">
            <img
                id="slideshowImage"
                class="active"
                src="images/pamel.jpg"
                alt="Pamel Longjam">

            <img
                id="slideshowImageNext"
                class="inactive"
                src="images/pamel.jpg"
                alt="Pamel Longjam">
        </div>

        <div class="slide-controls">
            <button id="previousPhoto" aria-label="Previous photo">‹</button>
            <span class="slide-number" id="slideNumber">01 / 03</span>
            <button id="nextPhoto" aria-label="Next photo">›</button>
        </div>
    </section>

    <!-- NAME AND DATE -->

    <section class="name-section">
        <h2>Pamel Longjam</h2>
        <p class="birth-date">7 NOVEMBER 2002</p>
        <p class="birth-time">3:13 PM</p>
    </section>

    <!-- SINCE BIRTH COUNTER -->

    <section class="counter-section">
        <h2 class="counter-title">Since Birth</h2>

        <div class="counter-grid">
            <div class="counter-box">
                <span id="years">00</span>
                <small>YEARS</small>
            </div>

            <div class="counter-box">
                <span id="days">00</span>
                <small>DAYS</small>
            </div>

            <div class="counter-box">
                <span id="hours">00</span>
                <small>HOURS</small>
            </div>

            <div class="counter-box">
                <span id="minutes">00</span>
                <small>MINUTES</small>
            </div>

            <div class="counter-box">
                <span id="seconds">00</span>
                <small>SECONDS</small>
            </div>
        </div>
    </section>

    <!-- ANALOG AND DIGITAL CLOCK -->

    <section class="clock-section">
        <h2 class="clock-heading">The Time</h2>

        <div class="clock" id="birthClock">
            <div class="clock-markers" id="clockMarkers"></div>
            <div class="clock-numbers" id="clockNumbers"></div>
            <div class="clock-brand">PAMEL</div>
            <div class="clock-est">EST. 2002</div>
            <div class="hand hour-hand"></div>
            <div class="hand minute-hand"></div>
            <div class="hand second-hand"></div>
            <div class="clock-center"></div>
        </div>

        <div class="digital-clock" id="digitalClock">
            00:00:00 AM
        </div>
    </section>

    <!-- CALENDAR -->

    <section class="calendar-section">
        <h2 class="calendar-title">Calendar</h2>

        <div class="calendar">
            <div class="calendar-header">
                <button id="previousMonth" aria-label="Previous month">‹</button>
                <h3 id="monthYear"></h3>
                <button id="todayButton" class="today-button">Today</button>
                <button id="nextMonth" aria-label="Next month">›</button>
            </div>

            <div class="calendar-grid" id="calendarGrid"></div>
        </div>
    </section>

    <!-- MUSIC BUTTON -->

    <section class="music-section">
        <button
            class="music-button"
            id="musicButton"
            aria-label="Pause music">Ⅱ</button>
    </section>

</div>
</main>

<!-- AUDIO -->

<audio id="pianoMusic" src="audio/piano.mp3" loop preload="auto"></audio>
<audio id="sparkleSound" src="audio/Sparkle.mp3" preload="auto"></audio>
<audio id="partyPopSound" src="audio/Partypop.mp3" preload="auto"></audio>

<script>

/* INITIAL OPENING SCREEN APPEARANCE */

window.addEventListener("load", () => {
    requestAnimationFrame(() => {
        openingScreen.classList.add("ready");
    });
});


/* REVEAL TRANSITION */

const revealButton = document.getElementById("revealButton");
const openingScreen = document.getElementById("openingScreen");
const mainContent = document.getElementById("mainContent");

const piano = document.getElementById("pianoMusic");
const sparkle = document.getElementById("sparkleSound");
const partyPop = document.getElementById("partyPopSound");

let revealed = false;

revealButton.addEventListener("click", () => {
    if (revealed) return;

    revealed = true;

    mainContent.classList.add("show");
    openingScreen.classList.add("hide");

    [piano, sparkle, partyPop].forEach(audio => {
        audio.currentTime = 0;
    });

    Promise.allSettled([
        piano.play(),
        sparkle.play(),
        partyPop.play()
    ]);

    startSlideshow();
    firePartyPopper();
});


/* CONFETTI */

function firePartyPopper() {
    if (typeof confetti !== "function") return;

    confetti({
        particleCount: 110,
        angle: 60,
        spread: 75,
        startVelocity: 55,
        gravity: 1,
        ticks: 180,
        origin: { x: 0, y: 0.65 }
    });

    confetti({
        particleCount: 110,
        angle: 120,
        spread: 75,
        startVelocity: 55,
        gravity: 1,
        ticks: 180,
        origin: { x: 1, y: 0.65 }
    });
}


/* SEAMLESS TWO-IMAGE SLIDESHOW */

const photos = [
    "images/pamel.jpg",
    "images/pamel1.jpg",
    "images/pamel2.jpg"
];

const photoA = document.getElementById("slideshowImage");
const photoB = document.getElementById("slideshowImageNext");
const slideNumber = document.getElementById("slideNumber");

let currentPhoto = 0;
let activeLayer = 0;
let slideshowTimer = null;
let changingPhoto = false;
let requestedPhoto = null;

const preloadedPhotos = [];

function preloadAllPhotos() {
    photos.forEach((src, index) => {
        const img = new Image();

        img.onload = () => {
            preloadedPhotos[index] = img;
        };

        img.src = src;

        if (img.complete && img.naturalWidth > 0) {
            preloadedPhotos[index] = img;
        }
    });
}

preloadAllPhotos();

function showPhoto(index) {
    requestedPhoto = (index + photos.length) % photos.length;

    if (changingPhoto) return;

    const processNextPhoto = () => {
        if (requestedPhoto === null) {
            changingPhoto = false;
            return;
        }

        changingPhoto = true;

        const targetIndex = requestedPhoto;
        requestedPhoto = null;

        if (targetIndex === currentPhoto) {
            changingPhoto = false;
            return;
        }

        const preload = new Image();
        let finished = false;

        function finish(success) {
            if (finished) return;
            finished = true;

            if (!success) {
                changingPhoto = false;
                if (requestedPhoto !== null) processNextPhoto();
                return;
            }

            const incoming = activeLayer === 0 ? photoB : photoA;
            const outgoing = activeLayer === 0 ? photoA : photoB;

            incoming.src = photos[targetIndex];

            incoming.classList.remove("inactive");
            incoming.classList.add("active");

            outgoing.classList.remove("active");
            outgoing.classList.add("inactive");

            activeLayer = activeLayer === 0 ? 1 : 0;
            currentPhoto = targetIndex;

            slideNumber.textContent =
                `${String(targetIndex + 1).padStart(2, "0")} / 03`;

            setTimeout(() => {
                changingPhoto = false;

                if (requestedPhoto !== null) {
                    processNextPhoto();
                }
            }, 560);
        }

        preload.onload = () => finish(true);
        preload.onerror = () => finish(false);
        preload.src = photos[targetIndex];

        if (preload.complete && preload.naturalWidth > 0) {
            finish(true);
        }
    };

    processNextPhoto();
}

function startSlideshow() {
    if (slideshowTimer !== null) return;

    slideshowTimer = setInterval(() => {
        showPhoto(currentPhoto + 1);
    }, 4000);
}

document.getElementById("nextPhoto").addEventListener("click", () => {
    showPhoto(currentPhoto + 1);
});

document.getElementById("previousPhoto").addEventListener("click", () => {
    showPhoto(currentPhoto - 1);
});


/* ANALOG AND DIGITAL CLOCK */

const hourHand = document.querySelector(".hour-hand");
const minuteHand = document.querySelector(".minute-hand");
const secondHand = document.querySelector(".second-hand");
const digitalClock = document.getElementById("digitalClock");

function updateClock() {
    const now = new Date();

    const hours = now.getHours() % 12;
    const minutes = now.getMinutes();
    const seconds = now.getSeconds();
    const milliseconds = now.getMilliseconds();

    const secondAngle = (seconds + milliseconds / 1000) * 6;
    const minuteAngle = (minutes + seconds / 60) * 6;
    const hourAngle = (hours + minutes / 60 + seconds / 3600) * 30;

    hourHand.style.transform =
        `translateX(-50%) rotate(${hourAngle}deg)`;

    minuteHand.style.transform =
        `translateX(-50%) rotate(${minuteAngle}deg)`;

    secondHand.style.transform =
        `translateX(-50%) rotate(${secondAngle}deg)`;

    digitalClock.textContent = now.toLocaleTimeString("en-IN", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
    });

    requestAnimationFrame(updateClock);
}

updateClock();


/* CLOCK MARKERS AND ROMAN NUMERALS */

const clock = document.getElementById("birthClock");
const clockMarkers = document.getElementById("clockMarkers");
const clockNumbers = document.getElementById("clockNumbers");

const romanNumerals = [
    "XII", "I", "II", "III", "IV", "V",
    "VI", "VII", "VIII", "IX", "X", "XI"
];

function createClockMarkers() {
    const size = clock.clientWidth;

    if (!size) return;

    clockMarkers.innerHTML = "";
    clockNumbers.innerHTML = "";

    for (let i = 0; i < 60; i++) {
        const tick = document.createElement("div");

        tick.className =
            i % 5 === 0 ? "tick major" : "tick";

        tick.style.transform =
            `translate(-50%, -50%) rotate(${i * 6}deg) translateY(-${size * 0.445}px)`;

        clockMarkers.appendChild(tick);
    }

    for (let i = 0; i < 12; i++) {
        const number = document.createElement("div");

        number.className = "clock-number";
        number.textContent = romanNumerals[i];

        const angle = i * 30 * Math.PI / 180;
        const radius = size * 0.355;

        const x = size / 2 + Math.sin(angle) * radius;
        const y = size / 2 - Math.cos(angle) * radius;

        number.style.left = `${x}px`;
        number.style.top = `${y}px`;

        clockNumbers.appendChild(number);
    }
}

createClockMarkers();
window.addEventListener("resize", createClockMarkers);


/* SINCE BIRTH COUNTER: 7 NOVEMBER 2002, 3:13 PM IST */

function updateAgeCounter() {
    const now = Date.now();

    const currentYear = Number(
        new Intl.DateTimeFormat("en-IN", {
            timeZone: "Asia/Kolkata",
            year: "numeric"
        }).format(new Date(now))
    );

    let years = currentYear - 2002;

    let lastBirthday = Date.UTC(
        2002 + years,
        10,
        7,
        9,
        43,
        0
    );

    if (now < lastBirthday) {
        years--;

        lastBirthday = Date.UTC(
            2002 + years,
            10,
            7,
            9,
            43,
            0
        );
    }

    let remaining = Math.max(0, now - lastBirthday);

    const days = Math.floor(remaining / 86400000);
    remaining %= 86400000;

    const hours = Math.floor(remaining / 3600000);
    remaining %= 3600000;

    const minutes = Math.floor(remaining / 60000);
    remaining %= 60000;

    const seconds = Math.floor(remaining / 1000);

    document.getElementById("years").textContent = years;
    document.getElementById("days").textContent = days;
    document.getElementById("hours").textContent = hours;
    document.getElementById("minutes").textContent = minutes;
    document.getElementById("seconds").textContent = seconds;
}

updateAgeCounter();
setInterval(updateAgeCounter, 1000);


/* CALENDAR */

const calendarGrid = document.getElementById("calendarGrid");
const monthYear = document.getElementById("monthYear");

let calendarDate = new Date();

function renderCalendar() {
    calendarGrid.innerHTML = "";

    const year = calendarDate.getFullYear();
    const month = calendarDate.getMonth();

    monthYear.textContent = calendarDate.toLocaleDateString("en-US", {
        month: "long",
        year: "numeric"
    });

    const weekdays = [
        "Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"
    ];

    weekdays.forEach(day => {
        const element = document.createElement("div");

        element.className = "calendar-day weekday";
        element.textContent = day;

        calendarGrid.appendChild(element);
    });

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();

    for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement("div");

        empty.className = "calendar-day";
        calendarGrid.appendChild(empty);
    }

    const today = new Date();

    for (let day = 1; day <= daysInMonth; day++) {
        const element = document.createElement("div");

        element.className = "calendar-day";
        element.textContent = day;

        if (month === 10 && day === 7) {
            element.classList.add("birthday");
        }

        if (
            year === today.getFullYear() &&
            month === today.getMonth() &&
            day === today.getDate()
        ) {
            element.classList.add("today");
        }

        calendarGrid.appendChild(element);
    }
}

document.getElementById("previousMonth").addEventListener("click", () => {
    calendarDate.setDate(1);
    calendarDate.setMonth(calendarDate.getMonth() - 1);
    renderCalendar();
});

document.getElementById("nextMonth").addEventListener("click", () => {
    calendarDate.setDate(1);
    calendarDate.setMonth(calendarDate.getMonth() + 1);
    renderCalendar();
});

document.getElementById("todayButton").addEventListener("click", () => {
    calendarDate = new Date();
    renderCalendar();
});

renderCalendar();


/* PIANO MUSIC PLAY / PAUSE */

const musicButton = document.getElementById("musicButton");

musicButton.addEventListener("click", async () => {
    if (piano.paused) {
        try {
            await piano.play();

            musicButton.textContent = "Ⅱ";
            musicButton.setAttribute("aria-label", "Pause music");
        } catch (error) {
            console.error("Music playback failed:", error);
        }
    } else {
        piano.pause();

        musicButton.textContent = "▶";
        musicButton.setAttribute("aria-label", "Play music");
    }
});
